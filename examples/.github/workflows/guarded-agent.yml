# Example: an AI issue-triage agent, guarded by Titra.
#
# This is the dangerous-by-default pattern behind Clinejection, the gemini-cli
# TrustIssues compromise, and GitLost: an agent triggered by an outsider's issue,
# reading the issue body, holding a write token. Shrike flags this workflow as
# critical. Titra makes it safe to run: it watches every action the agent takes
# and blocks the ones that cross a line (push, PR approval, publish, exfil).
name: AI Issue Triage (guarded)

on:
  issues:
    types: [opened]

permissions:
  contents: read        # least privilege; the agent cannot push
  issues: write

jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false   # keep the token out of .git/config

      # One line. From here on, every git / gh / curl / npm the agent runs is
      # guarded. Start in monitor, flip to enforce once you trust it.
      - name: Titra guard
        uses: ChelateSec/titra@v1
        with:
          mode: enforce

      # Your agent step, unchanged. It now runs behind Titra.
      - name: Run triage agent
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            Triage issue #${{ github.event.issue.number }}.
            Read the issue, pick one label, and apply it. Nothing else.

      # Publish the record: a Markdown summary on the run, and the raw log as an
      # artifact (in the hosted product this streams to the Titra dashboard).
      - name: Titra report
        if: always()
        shell: bash
        run: titra report --format md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload action log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: titra-actions
          path: ${{ runner.temp }}/titra-actions.jsonl
