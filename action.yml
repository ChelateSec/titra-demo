name: "Titra"
description: "Watch what AI agents do in your CI job and block the dangerous actions, in real time."
author: "Chelate Sec"
branding:
  icon: "shield"
  color: "green"

inputs:
  mode:
    description: "monitor | dry-run | enforce. Start in monitor; flip to enforce when you trust it."
    required: false
    default: "monitor"
  policy:
    description: "Path to a Titra policy file. If empty, the built-in secure defaults are used."
    required: false
    default: ""
  tools:
    description: "Comma-separated tools to guard. Empty uses the built-in set (git, gh, curl, npm, ...)."
    required: false
    default: ""
  trace:
    description: "Watch the whole job with the kernel (every process, connection and credential read), not only guarded commands. Needs a Linux runner with sudo."
    required: false
    default: "true"
  dns:
    description: "With trace on, resolve outbound connections to domain names."
    required: false
    default: "true"
  allowed-domains:
    description: "Extra network destinations this job is expected to reach, comma-separated (e.g. api.mycorp.com,*.internal)."
    required: false
    default: ""
  report:
    description: "Post the run report to the job summary and set the check result automatically when the job ends."
    required: false
    default: "true"
  fail-on:
    description: "Fail the job if an action was blocked (block), on any finding (any), or never (off)."
    required: false
    default: "block"
  go-version:
    description: "Go version used to build the guard."
    required: false
    default: "1.22"

runs:
  using: "node20"
  main: "action/index.js"
  post: "action/post.js"
  post-if: "always()"
